<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Parque Nelson Mandela</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>

<body>

  <a-scene>

    <a-assets>
      <a-asset-item id="parque2" src="parque2.glb"></a-asset-item>
    </a-assets>

    <!-- Parque -->
    <a-entity
      gltf-model="#parque2"
      position="0 -20 0"
      rotation="0 0 0"
      scale="50 10 50">
    </a-entity>

    <!-- Cámara encima del parque -->
    <a-entity
      camera
      look-controls
      wasd-controls="acceleration: 40"
      position="0 0 0"
      rotation="-90 0 0">
    </a-entity>

  </a-scene>

</body>
</html>
